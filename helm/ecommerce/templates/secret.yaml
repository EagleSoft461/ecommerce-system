apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "ecommerce.labels" . | nindent 4 }}
type: Opaque
data:
  DB_USERNAME: {{ .Values.db.username }}
  DB_PASSWORD: {{ .Values.db.password }}
  JWT_SECRET: {{ .Values.jwt.secret }}
