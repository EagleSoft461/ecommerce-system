name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ── Monolith Build & Test ──────────────────────────────
  monolith:
    name: Monolith - Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: ecommerce_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build monolith
        run: mvn clean compile -q

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: monolith-classes
          path: target/classes

  # ── Auth Service Build ─────────────────────────────────
  auth-service:
    name: Auth Service - Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build auth-service
        run: mvn clean compile -q -f microservices/auth-service/pom.xml

  # ── Product Service Build ──────────────────────────────
  product-service:
    name: Product Service - Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build product-service
        run: mvn clean compile -q -f microservices/product-service/pom.xml

  # ── Order Service Build ────────────────────────────────
  order-service:
    name: Order Service - Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build order-service
        run: mvn clean compile -q -f microservices/order-service/pom.xml

  # ── API Gateway Build ──────────────────────────────────
  api-gateway:
    name: API Gateway - Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build api-gateway
        run: mvn clean compile -q -f microservices/api-gateway/pom.xml

  # ── All Services Pass ──────────────────────────────────
  all-services-pass:
    name: All Services Pass
    runs-on: ubuntu-latest
    needs: [monolith, auth-service, product-service, order-service, api-gateway]

    steps:
      - name: All builds successful
        run: echo "✅ All services built successfully!"
