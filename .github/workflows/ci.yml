name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ── Monolith Build ──────────────────────────────────────────────────────────
  monolith:
    name: Monolith - Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build monolith
        run: mvn clean compile -q

  # ── Auth Service - Build & Test ─────────────────────────────────────────────
  auth-service:
    name: Auth Service - Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build & Test auth-service
        run: mvn clean verify -f microservices/auth-service/pom.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: auth-service-test-results
          path: microservices/auth-service/target/surefire-reports/

  # ── Product Service Build ───────────────────────────────────────────────────
  product-service:
    name: Product Service - Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build product-service
        run: mvn clean package -DskipTests -q -f microservices/product-service/pom.xml

  # ── Order Service Build ─────────────────────────────────────────────────────
  order-service:
    name: Order Service - Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build order-service
        run: mvn clean package -DskipTests -q -f microservices/order-service/pom.xml

  # ── API Gateway Build ───────────────────────────────────────────────────────
  api-gateway:
    name: API Gateway - Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build api-gateway
        run: mvn clean package -DskipTests -q -f microservices/api-gateway/pom.xml

  # ── All Services Pass ───────────────────────────────────────────────────────
  all-services-pass:
    name: All Services Pass
    runs-on: ubuntu-latest
    needs: [monolith, auth-service, product-service, order-service, api-gateway]
    steps:
      - name: All builds and tests successful
        run: echo "✅ All services built and tested successfully!"
