apiVersion: v1
kind: ConfigMap
metadata:
  name: ecommerce-config
  namespace: ecommerce
data:
  # Database hosts (K8s Service isimleri)
  AUTH_DB_HOST: "auth-db-service"
  PRODUCT_DB_HOST: "product-db-service"
  ORDER_DB_HOST: "order-db-service"

  # Redis
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"

  # Kafka (K8s içinde service adı)
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"

  # Service URLs (K8s DNS: <service-name>.<namespace>.svc.cluster.local)
  AUTH_SERVICE_URL: "http://auth-service:8081"
  PRODUCT_SERVICE_URL: "http://product-service:8082"
  ORDER_SERVICE_URL: "http://order-service:8083"
